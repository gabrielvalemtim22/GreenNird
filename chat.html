<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GreenNird — Chat</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  body { display: flex; height: 100vh; overflow: hidden; }
  aside { position: relative; z-index: 3; width: 370px; flex-shrink: 0; background: #f7f8f6; border-right: 1px solid #eceee8; display: flex; flex-direction: column; padding: 24px 22px; transition: margin .25s; }
  aside.closed { margin-left: -370px; }
  .side-top { display: flex; align-items: center; gap: 6px; }
  .side-top .logo { flex: 1; font-size: 24px; }
  .new { margin: 26px 0 18px; display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--lime); border-radius: 999px; padding: 15px; font-weight: 700; font-size: 17px; box-shadow: 0 8px 20px rgba(190,230,0,.4); }
  .new svg { width: 24px; height: 24px; }
  .list { flex: 1; overflow-y: auto; margin: 0 -8px; padding: 0 8px; }
  .group { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-weight: 600; font-size: 16px; padding: 18px 8px 8px; }
  .item { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-radius: 12px; font-size: 16px; cursor: pointer; }
  .item span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .item:hover { background: #eef0ea; }
  .item.on { background: var(--lime-soft); }
  .item .del { opacity: 0; color: var(--muted); padding: 0 4px; font-size: 18px; }
  .item:hover .del, .item.on .del { opacity: 1; }
  .user { border-top: 1px solid #e4e6df; padding-top: 16px; display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 18px; }
  .avatar { width: 54px; height: 54px; border-radius: 50%; background: var(--lime); display: grid; place-items: center; font-weight: 800; font-size: 20px; }
  .user a { margin-left: auto; font-size: 14px; font-weight: 600; color: var(--muted); }

  .main { position: relative; flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { position: absolute; z-index: 3; top: 18px; left: 18px; display: none; }
  aside.closed ~ .main .topbar { display: flex; }
  .scroll { position: relative; z-index: 1; flex: 1; overflow-y: auto; }
  .hero { max-width: 1080px; margin: 0 auto; padding: 12vh 24px 0; text-align: center; }
  .hero .logo { font-size: 46px; gap: 18px; margin-top: 18px; }
  .hero .logo img { width: 84px; height: 84px; }
  .hero h1 { font-size: clamp(30px, 4.4vw, 56px); font-weight: 800; letter-spacing: -.03em; margin: 10px 0 46px; }
  .thread { max-width: 820px; margin: 0 auto; padding: 70px 24px 30px; display: flex; flex-direction: column; gap: 22px; }
  .msg { line-height: 1.65; font-size: 16.5px; }
  .msg.user { align-self: flex-end; background: var(--lime-soft); padding: 12px 18px; border-radius: 20px 20px 4px 20px; max-width: 80%; white-space: pre-wrap; }
  .msg.ai { display: flex; gap: 14px; }
  .msg.ai img { width: 34px; height: 34px; margin-top: 2px; }
  .msg.ai .body { flex: 1; min-width: 0; }
  .body p, .body ul, .body ol, .body pre, .body h1, .body h2, .body h3, .body table { margin-bottom: 12px; }
  .body ul, .body ol { padding-left: 22px; }
  .body pre { background: #111; color: #e8ffa0; padding: 14px; border-radius: 12px; overflow-x: auto; font-size: 14px; }
  .body code { background: #f0f2ea; padding: 1px 5px; border-radius: 5px; font-size: .92em; }
  .body pre code { background: none; padding: 0; }
  .body a { color: #5a7a00; text-decoration: underline; }
  .body table { border-collapse: collapse; } .body td, .body th { border: 1px solid #e3e5de; padding: 6px 10px; }
  .err { color: #b42318; }
  .dots span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #b9e000; margin-right: 4px; animation: b 1s infinite; }
  .dots span:nth-child(2) { animation-delay: .15s } .dots span:nth-child(3) { animation-delay: .3s }
  @keyframes b { 0%,80%,100% { opacity: .3 } 40% { opacity: 1 } }
  .dock { position: relative; z-index: 2; max-width: 1080px; width: 100%; margin: 0 auto; padding: 0 24px 22px; }
  .main.empty .dock { display: none; }
  .main:not(.empty) .hero { display: none; }
  .hint { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .vsep { width: 1px; height: 30px; background: #ddd; }
  @media (max-width: 860px) {
    aside { position: fixed; inset: 0 auto 0 0; box-shadow: 0 0 40px rgba(0,0,0,.15); width: 300px; }
    aside.closed { margin-left: -300px; }
    .dock { padding: 0 12px 12px; }
    .hero { padding: 10vh 16px 0; } .hero .logo { font-size: 34px; } .hero .logo img { width: 60px; height: 60px; }
  }
</style>
</head>
<body>
<aside id="side">
  <div class="side-top">
    <a class="logo" href="/"><img src="/assets/logo.svg" alt="">GreenNird</a>
    <button class="icon-btn" id="findBtn" title="Buscar conversas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button class="icon-btn" id="toggle" title="Fechar barra lateral"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
  </div>
  <button class="new" id="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Nova conversa</button>
  <div class="list" id="list"></div>
  <div class="user"><div class="avatar">G</div>Gabriel Valentim<a href="/admin">Admin</a></div>
</aside>

<div class="main empty" id="main">
  <div class="glow"></div>
  <div class="topbar"><button class="icon-btn" id="open" title="Abrir barra lateral"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button></div>
  <div class="scroll" id="scroll">
    <div class="hero">
      <div class="spark"><svg viewBox="0 0 24 24"><path fill="#d4ff00" d="M12 0c.6 6.4 5.6 11.4 12 12-6.4.6-11.4 5.6-12 12-.6-6.4-5.6-11.4-12-12C6.4 11.4 11.4 6.4 12 0z"/></svg></div>
      <div class="logo"><img src="/assets/logo.svg" alt="">GreenNird</div>
      <h1>Como posso ajudar você hoje?</h1>
      <div id="heroSlot"></div>
    </div>
    <div class="thread" id="thread"></div>
  </div>
  <div class="dock"><div id="dockSlot"></div><div class="hint">GreenNird pode cometer erros. Verifique informações importantes.</div></div>
</div>

<template id="composerTpl">
  <form class="composer" id="f">
    <textarea id="q" rows="2" placeholder="Mensagem para GreenNird"></textarea>
    <div class="row">
      <button type="button" class="chip" id="think"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M12 5v13"/></svg>Pensar</button>
      <button type="button" class="chip on" id="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Pesquisar</button>
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="attach" title="Anexar arquivo de texto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 12V6a4 4 0 0 1 8 0v10a6 6 0 0 1-12 0V8"/><path d="M12 7v9"/></svg></button>
      <input type="file" id="file" accept=".txt,.md,.csv,.json,.html,.js,.css,.py" hidden>
      <span class="vsep"></span>
      <button class="send" id="sendBtn" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"><path d="M21 3 3 10.5l7.5 3L21 3Zm0 0-7.5 18-3-7.5"/></svg></button>
    </div>
  </form>
</template>

<script src="/assets/chat.js"></script>
</body>
</html>
